<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>빛의 밝기와 거리 — 그래프 그리기</title><style>*{box-sizing:border-box}body{font-family:'Malgun Gothic',sans-serif;background:#edf2f8;color:#18283c;margin:0}.wrap{max-width:1050px;margin:24px auto;background:#fff;padding:30px;border-radius:12px}h1{text-align:center;color:#234b7d}p{line-height:1.6}.grid{display:grid;grid-template-columns:1fr;gap:18px}.card{border:1px solid #bdcce0;padding:15px;border-radius:8px;min-width:0}canvas{width:100%;height:auto;display:block}button{border:0;border-radius:8px;background:#28558e;color:white;padding:12px 17px;cursor:pointer;font:inherit;margin:6px 4px 6px 0}.secondary{background:#e5edf7;color:#244d7e}.notice{color:#64758c}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border:1px solid #bdcce0;padding:8px;text-align:center}th{background:#e7edf6}td input{width:100%;min-width:0;padding:8px;border:1px solid #b5c3d4;border-radius:5px;font:inherit;text-align:center;background:#fbfdff}.tablewrap{overflow-x:auto}.input-actions{margin:12px 0}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{margin:0;padding:15px}}</style></head><body><main class="wrap"><h1>📈 빛의 밝기와 거리의 수상한 관계</h1><p>학습지에서 계산한 상대 밝기 측정값과 이론값 1, 2를 아래 표에 직접 입력하세요. 가로축은 거리(cm), 세로축은 상대 밝기(%)입니다.</p><button class="secondary" onclick="location.href='index.html'">← 학습지로 돌아가기</button><h2>그래프 데이터 직접 입력</h2><div class="tablewrap"><table><thead><tr><th>거리 (x)</th><th>측정값 (y, %)</th><th>이론값 1 (y, %)</th><th>이론값 2 (y, %)</th></tr></thead><tbody id="values"></tbody></table></div><div class="input-actions"><button onclick="plot()">📈 그래프 그리기</button></div><p class="notice" id="status" role="status">표에 상대 밝기 12개를 직접 입력한 뒤 그래프 그리기 버튼을 누르세요.</p><div class="grid"><section class="card"><h2>측정값 그래프</h2><canvas id="measured" width="900" height="680"></canvas><button onclick="save('measured','측정값_그래프.png')">측정값 이미지 저장하기</button></section><section class="card"><h2>이론값 1 그래프</h2><canvas id="theory" width="900" height="680"></canvas><button onclick="save('theory','이론값1_그래프.png')">이론값 1 이미지 저장하기</button></section><section class="card"><h2>이론값 2 그래프</h2><canvas id="theory2" width="900" height="680"></canvas><button onclick="save('theory2','이론값2_그래프.png')">이론값 2 이미지 저장하기</button></section></div><p class="notice">이미지 3개를 저장한 뒤 학습지의 활동 5에 각각 업로드하세요.</p></main><script>const ds=[20,40,60,80];const series=[['measured','측정값'],['theory','이론값 1'],['theory2','이론값 2']];let plotted=false;const num=v=>v===''||v==null?null:Number.isFinite(+v)?+v:null;const fmt=n=>n===null?'미입력':String(Math.round(n*100)/100);function init(){document.getElementById('values').innerHTML=ds.map(d=>`<tr><th scope="row">${d}cm</th>${series.map(([id,label])=>`<td><input type="number" step="any" id="${id}_${d}" aria-label="${d}cm ${label}" placeholder="입력"></td>`).join('')}</tr>`).join('');series.forEach(([id,label])=>draw(id,ds.map(()=>null),label));document.getElementById('values').addEventListener('input',()=>{plotted=false;document.getElementById('status').textContent='입력값이 변경되었습니다. 그래프 그리기 버튼을 눌러 주세요.'})}function plot(){const values=series.map(([id])=>ds.map(d=>num(document.getElementById(`${id}_${d}`).value)));if(values.some(a=>a.some(v=>v===null))){document.getElementById('status').textContent='빈칸 없이 숫자 12개를 모두 입력하세요.';return}series.forEach(([id,label],i)=>draw(id,values[i],label));plotted=true;document.getElementById('status').textContent='그래프 3개가 완성되었습니다. 이미지를 각각 저장하세요.'}function draw(id,values,label){const c=document.getElementById(id),ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const L=115,R=45,T=90,B=115,PW=W-L-R,PH=H-T-B;const valid=values.filter(v=>v!==null&&Number.isFinite(v));const max=Math.max(100,...valid,0),top=Math.ceil(max/20)*20||100,bottom=Math.floor(Math.min(0,...valid)/20)*20,range=top-bottom;ctx.fillStyle='#18283c';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.fillText(`거리별 상대 밝기 (${label})`,W/2,48);ctx.font='21px sans-serif';ctx.strokeStyle='#dce5f0';ctx.lineWidth=2;for(let i=0;i<=5;i++){let val=bottom+range*i/5,y=T+PH-((val-bottom)/range)*PH;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.fillStyle='#50637e';ctx.textAlign='right';ctx.fillText(fmt(val),L-15,y+7)}ctx.strokeStyle='#304e77';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+PH);ctx.lineTo(W-R,T+PH);ctx.stroke();const x=d=>L+(d-20)/60*PW,y=v=>T+PH-(v-bottom)/range*PH;ds.forEach(d=>{ctx.fillStyle='#50637e';ctx.textAlign='center';ctx.fillText(String(d),x(d),T+PH+35)});ctx.fillStyle='#18283c';ctx.font='bold 23px sans-serif';ctx.fillText('거리 (cm)',W/2,H-26);ctx.save();ctx.translate(32,T+PH/2);ctx.rotate(-Math.PI/2);ctx.fillText('상대 밝기 (%)',0,0);ctx.restore();ctx.strokeStyle=id==='measured'?'#2376bc':id==='theory'?'#d06b38':'#37865b';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=5;ctx.beginPath();let started=false;values.forEach((v,i)=>{if(v===null){started=false;return}if(!started){ctx.moveTo(x(ds[i]),y(v));started=true}else ctx.lineTo(x(ds[i]),y(v))});ctx.stroke();values.forEach((v,i)=>{if(v===null)return;ctx.beginPath();ctx.arc(x(ds[i]),y(v),8,0,Math.PI*2);ctx.fill();ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(fmt(v)+'%',x(ds[i]),Math.max(T+22,y(v)-19))})}function save(id,name){if(!plotted){alert('값을 모두 입력하고 그래프 그리기 버튼을 먼저 눌러 주세요.');return}let a=document.createElement('a');a.href=document.getElementById(id).toDataURL('image/png');a.download=name;document.body.appendChild(a);a.click();a.remove()}init();</script></body></html>
