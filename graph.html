<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그래프 그리기</title><style>*{box-sizing:border-box}body{font-family:'Malgun Gothic',sans-serif;background:#edf2f8;color:#18283c;margin:0}.wrap{max-width:1050px;margin:24px auto;background:#fff;padding:30px;border-radius:12px}h1{text-align:center;color:#234b7d}p{line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid #bdcce0;padding:15px;border-radius:8px;min-width:0}canvas{width:100%;height:auto;display:block}button{border:0;border-radius:8px;background:#28558e;color:white;padding:12px 17px;cursor:pointer;font:inherit;margin:6px 4px 6px 0}.secondary{background:#e5edf7;color:#244d7e}.notice{color:#64758c}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border:1px solid #bdcce0;padding:8px;text-align:center}th{background:#e7edf6}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{margin:0;padding:15px}}</style><style>input{width:100%;min-width:45px;padding:8px;font:inherit;border:1px solid #bdcce0}.grid{grid-template-columns:1fr}@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}} </style></head><body><main class="wrap"><h1>빛의 밝기와 거리 — 그래프 그리기</h1><p>학습지의 활동 5 표를 참고하여 데이터를 직접 입력하세요. 가로축은 거리(cm), 세로축은 상대 밝기(%)입니다.</p><button class="secondary" onclick="location.href='index.html'">← 학습지로 돌아가기</button><table><thead><tr><th>거리(cm)</th><th>측정값 (%)</th><th>이론값 1 (%)</th><th>이론값 2 (%)</th></tr></thead><tbody><tr><th>20</th><td><input type="number" step="any" id="measured20" aria-label="measured 20cm"></td><td><input type="number" step="any" id="theory120" aria-label="theory1 20cm"></td><td><input type="number" step="any" id="theory220" aria-label="theory2 20cm"></td></tr><tr><th>40</th><td><input type="number" step="any" id="measured40" aria-label="measured 40cm"></td><td><input type="number" step="any" id="theory140" aria-label="theory1 40cm"></td><td><input type="number" step="any" id="theory240" aria-label="theory2 40cm"></td></tr><tr><th>60</th><td><input type="number" step="any" id="measured60" aria-label="measured 60cm"></td><td><input type="number" step="any" id="theory160" aria-label="theory1 60cm"></td><td><input type="number" step="any" id="theory260" aria-label="theory2 60cm"></td></tr><tr><th>80</th><td><input type="number" step="any" id="measured80" aria-label="measured 80cm"></td><td><input type="number" step="any" id="theory180" aria-label="theory1 80cm"></td><td><input type="number" step="any" id="theory280" aria-label="theory2 80cm"></td></tr></tbody></table><button onclick="plot()">그래프 그리기</button><p id="status" class="notice"></p><div class="grid"><section class="card"><h2>측정값 그래프</h2><canvas id="measured" width="900" height="680" style="display:none"></canvas><button id="save_measured" disabled onclick="save('measured','측정값_그래프.png')">이미지 저장하기</button></section><section class="card"><h2>이론값 1 그래프</h2><canvas id="theory1" width="900" height="680" style="display:none"></canvas><button id="save_theory1" disabled onclick="save('theory1','이론값 1_그래프.png')">이미지 저장하기</button></section><section class="card"><h2>이론값 2 그래프</h2><canvas id="theory2" width="900" height="680" style="display:none"></canvas><button id="save_theory2" disabled onclick="save('theory2','이론값 2_그래프.png')">이미지 저장하기</button></section></div></main><script>const ds=[20,40,60,80];const fmt=n=>String(Math.round(n*100)/100);function plot(){for(const [k,label] of [["measured","측정값"],["theory1","이론값 1"],["theory2","이론값 2"]]){let values=ds.map(d=>{let v=document.getElementById(k+d).value;return v!==""&&Number.isFinite(+v)?+v:null});document.getElementById(k).style.display="block";draw(k,values,label);document.getElementById("save_"+k).disabled=values.every(v=>v===null)}document.getElementById("status").textContent="입력한 데이터로 그래프를 그렸습니다. 빈 칸은 표시하지 않습니다."}function draw(id,values,label){const c=document.getElementById(id),ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const L=115,R=45,T=90,B=115,PW=W-L-R,PH=H-T-B;const valid=values.filter(v=>v!==null&&Number.isFinite(v));const max=Math.max(100,...valid,0),top=Math.ceil(max/20)*20||100;ctx.fillStyle='#18283c';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.fillText(`거리별 상대 밝기 (${label})`,W/2,48);ctx.font='21px sans-serif';ctx.strokeStyle='#dce5f0';ctx.lineWidth=2;for(let i=0;i<=5;i++){let val=top*i/5,y=T+PH-(val/top)*PH;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.fillStyle='#50637e';ctx.textAlign='right';ctx.fillText(fmt(val),L-15,y+7)}ctx.strokeStyle='#304e77';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+PH);ctx.lineTo(W-R,T+PH);ctx.stroke();const x=d=>L+(d-20)/60*PW,y=v=>T+PH-v/top*PH;ds.forEach(d=>{ctx.fillStyle='#50637e';ctx.textAlign='center';ctx.fillText(String(d),x(d),T+PH+35)});ctx.fillStyle='#18283c';ctx.font='bold 23px sans-serif';ctx.fillText('거리 (cm)',W/2,H-26);ctx.save();ctx.translate(32,T+PH/2);ctx.rotate(-Math.PI/2);ctx.fillText('상대 밝기 (%)',0,0);ctx.restore();ctx.strokeStyle=id==='measured'?'#2376bc':id==='theory1'?'#d06b38':'#34865c';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=5;ctx.beginPath();let started=false;values.forEach((v,i)=>{if(v===null){started=false;return}if(!started){ctx.moveTo(x(ds[i]),y(v));started=true}else ctx.lineTo(x(ds[i]),y(v))});ctx.stroke();values.forEach((v,i)=>{if(v===null)return;ctx.beginPath();ctx.arc(x(ds[i]),y(v),8,0,Math.PI*2);ctx.fill();ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(fmt(v)+'%',x(ds[i]),Math.max(T+22,y(v)-19))})}function save(id,name){let a=document.createElement('a');a.href=document.getElementById(id).toDataURL('image/png');a.download=name;document.body.appendChild(a);a.click();a.remove()}</script></body></html>
