<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>빛의 밝기와 거리 — 그래프 그리기</title><style>*{box-sizing:border-box}body{font-family:'Malgun Gothic',sans-serif;background:#edf2f8;color:#18283c;margin:0}.wrap{max-width:1050px;margin:24px auto;background:#fff;padding:30px;border-radius:12px}h1{text-align:center;color:#234b7d}p{line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid #bdcce0;padding:15px;border-radius:8px;min-width:0}canvas{width:100%;height:auto;display:block}button{border:0;border-radius:8px;background:#28558e;color:white;padding:12px 17px;cursor:pointer;font:inherit;margin:6px 4px 6px 0}.secondary{background:#e5edf7;color:#244d7e}.notice{color:#64758c}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border:1px solid #bdcce0;padding:8px;text-align:center}th{background:#e7edf6}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{margin:0;padding:15px}}</style></head><body><main class="wrap"><h1>📈 빛의 밝기와 거리의 수상한 관계</h1><p>학습지에서 입력한 <b>상대 밝기 측정값</b>과 <b>이론값</b>을 가져와 그래프를 그립니다. 가로축은 거리(cm), 세로축은 상대 밝기(%)입니다.</p><button class="secondary" onclick="location.href='index.html'">← 학습지로 돌아가기</button><button onclick="load()">↻ 학습지 값 다시 불러오기</button><p class="notice" id="status"></p><div class="grid"><section class="card"><h2>측정값 그래프</h2><canvas id="measured" width="900" height="680"></canvas><button onclick="save('measured','측정값_그래프.png')">측정값 이미지 저장하기</button></section><section class="card"><h2>이론값 그래프</h2><canvas id="theory" width="900" height="680"></canvas><button onclick="save('theory','이론값_그래프.png')">이론값 이미지 저장하기</button></section></div><h2>그래프 데이터</h2><table><thead><tr><th>거리</th><th>측정값 (%)</th><th>이론값 (%)</th></tr></thead><tbody id="values"></tbody></table><p class="notice">이미지를 저장한 뒤 학습지의 활동 5에 각각 업로드하세요. 측정값이 비어 있는 경우 해당 점은 표시되지 않습니다.</p></main><script>const ds=[20,40,60,80];let measured=[],theory=[];const num=v=>v===''||v==null?null:Number.isFinite(+v)?+v:null;const fmt=n=>n===null?'미입력':String(Math.round(n*100)/100);function load(){let data={};try{data=JSON.parse(localStorage.getItem('lightWorksheet')||'{}')}catch(e){}let bg=num(data.background),corrected={};ds.forEach(d=>{let a=[1,2,3].map(i=>num(data[`lux${d}_${i}`]));corrected[d]=a.every(v=>v!==null)&&bg!==null?a.reduce((s,v)=>s+v,0)/3-bg:null});measured=ds.map(d=>corrected[d]!==null&&corrected[20]!==null&&corrected[20]>0?100*corrected[d]/corrected[20]:null);theory=ds.map(d=>{let dist=d===20?20:num(data[`theoryDistance${d}`]??String(d));return dist!==null&&dist>0?100*(20/dist)**2:null});document.getElementById('values').innerHTML=ds.map((d,i)=>`<tr><td>${d}cm</td><td>${fmt(measured[i])}</td><td>${fmt(theory[i])}</td></tr>`).join('');document.getElementById('status').textContent=measured.every(v=>v===null)?'측정값이 없습니다. 학습지 활동 2에서 배경 조도와 거리별 측정값을 입력해 주세요.':'학습지에서 데이터를 불러왔습니다.';draw('measured',measured,'측정값');draw('theory',theory,'이론값')}function draw(id,values,label){const c=document.getElementById(id),ctx=c.getContext('2d'),W=c.width,H=c.height;ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);const L=115,R=45,T=90,B=115,PW=W-L-R,PH=H-T-B;const valid=values.filter(v=>v!==null&&Number.isFinite(v));const max=Math.max(100,...valid,0),top=Math.ceil(max/20)*20||100;ctx.fillStyle='#18283c';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.fillText(`거리별 상대 밝기 (${label})`,W/2,48);ctx.font='21px sans-serif';ctx.strokeStyle='#dce5f0';ctx.lineWidth=2;for(let i=0;i<=5;i++){let val=top*i/5,y=T+PH-(val/top)*PH;ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.fillStyle='#50637e';ctx.textAlign='right';ctx.fillText(fmt(val),L-15,y+7)}ctx.strokeStyle='#304e77';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(L,T);ctx.lineTo(L,T+PH);ctx.lineTo(W-R,T+PH);ctx.stroke();const x=d=>L+(d-20)/60*PW,y=v=>T+PH-v/top*PH;ds.forEach(d=>{ctx.fillStyle='#50637e';ctx.textAlign='center';ctx.fillText(String(d),x(d),T+PH+35)});ctx.fillStyle='#18283c';ctx.font='bold 23px sans-serif';ctx.fillText('거리 (cm)',W/2,H-26);ctx.save();ctx.translate(32,T+PH/2);ctx.rotate(-Math.PI/2);ctx.fillText('상대 밝기 (%)',0,0);ctx.restore();ctx.strokeStyle=id==='measured'?'#2376bc':'#d06b38';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=5;ctx.beginPath();let started=false;values.forEach((v,i)=>{if(v===null){started=false;return}if(!started){ctx.moveTo(x(ds[i]),y(v));started=true}else ctx.lineTo(x(ds[i]),y(v))});ctx.stroke();values.forEach((v,i)=>{if(v===null)return;ctx.beginPath();ctx.arc(x(ds[i]),y(v),8,0,Math.PI*2);ctx.fill();ctx.font='bold 21px sans-serif';ctx.textAlign='center';ctx.fillText(fmt(v)+'%',x(ds[i]),Math.max(T+22,y(v)-19))})}function save(id,name){let a=document.createElement('a');a.href=document.getElementById(id).toDataURL('image/png');a.download=name;document.body.appendChild(a);a.click();a.remove()}load();</script></body></html>
